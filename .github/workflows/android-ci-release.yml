name: QuoteMaker Android Build and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build QuoteMaker APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Determine application version from release tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "Use a semantic version tag such as v1.0.2" >&2
              exit 1
            fi
            IFS='.' read -r major minor patch <<< "$version"
            if (( minor > 999 || patch > 999 || major > 2000 )); then
              echo "Version component is too large for the app version-code scheme" >&2
              exit 1
            fi
            version_code=$((major * 1000000 + minor * 1000 + patch))
          else
            version="1.0.2"
            version_code=1000002
          fi
          echo "version_name=$version" >> "$GITHUB_OUTPUT"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "Building version $version (versionCode $version_code)"

      - name: Build debug APK (main branch, pull request, or manual run)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug \
            -PappVersionName='${{ steps.version.outputs.version_name }}' \
            -PappVersionCode='${{ steps.version.outputs.version_code }}'

      - name: Upload debug APK artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: QuoteMaker-debug-${{ github.run_number }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Verify release signing secrets are configured
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          SBE_KEYSTORE_BASE64: ${{ secrets.SBE_KEYSTORE_BASE64 }}
          SBE_KEYSTORE_PASSWORD: ${{ secrets.SBE_KEYSTORE_PASSWORD }}
          SBE_KEY_ALIAS: ${{ secrets.SBE_KEY_ALIAS }}
          SBE_KEY_PASSWORD: ${{ secrets.SBE_KEY_PASSWORD }}
        run: |
          test -n "$SBE_KEYSTORE_BASE64" || { echo "Missing repository secret SBE_KEYSTORE_BASE64" >&2; exit 1; }
          test -n "$SBE_KEYSTORE_PASSWORD" || { echo "Missing repository secret SBE_KEYSTORE_PASSWORD" >&2; exit 1; }
          test -n "$SBE_KEY_ALIAS" || { echo "Missing repository secret SBE_KEY_ALIAS" >&2; exit 1; }
          test -n "$SBE_KEY_PASSWORD" || { echo "Missing repository secret SBE_KEY_PASSWORD" >&2; exit 1; }

      - name: Restore release signing key
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          SBE_KEYSTORE_BASE64: ${{ secrets.SBE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$SBE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/sbe-release.keystore"
          test -s "$RUNNER_TEMP/sbe-release.keystore"

      - name: Build signed release APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        env:
          SBE_KEYSTORE_FILE: ${{ runner.temp }}/sbe-release.keystore
          SBE_KEYSTORE_PASSWORD: ${{ secrets.SBE_KEYSTORE_PASSWORD }}
          SBE_KEY_ALIAS: ${{ secrets.SBE_KEY_ALIAS }}
          SBE_KEY_PASSWORD: ${{ secrets.SBE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleRelease \
            -PappVersionName='${{ steps.version.outputs.version_name }}' \
            -PappVersionCode='${{ steps.version.outputs.version_code }}'
          cp app/build/outputs/apk/release/app-release.apk QuoteMaker.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose QuoteMaker.apk

      - name: Publish GitHub Release with signed APK
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: softprops/action-gh-release@v2
        with:
          name: QuoteMaker v${{ steps.version.outputs.version_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: QuoteMaker.apk
          fail_on_unmatched_files: true
